[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "defecttrack"
version = "1.0.0"
description = "Real-time multi-object tracking of defect clusters in in-situ TEM videos"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rajat Sainju" }]
dependencies = [
    "torch>=1.7",
    "numpy",
    "scipy",
    "opencv-python-headless",
    "lap",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
defecttrack = "defecttrack.cli:main"

[project.urls]
Paper = "https://doi.org/10.1038/s41598-022-19697-1"

[tool.setuptools.packages.find]
include = ["defecttrack*"]

[tool.pytest.ini_options]
markers = ["slow: runs the full tracker on the sample sequence"]
